<!DOCTYPE html>
<html>
    <head>
        <title>Tic-tac-toe</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
        <style>
            * { 
                box-sizing: border-box; 
                margin: 0; 
                padding: 0; 
            }

            body {
                font-family: sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                padding: 2rem;
                background: #fafafa;
            }

            .container { 
                width: 100%; 
                max-width: 420px; 
            }

            .header { 
                text-align: center; 
                margin-bottom: 2rem; 
            }

            .header .marks { 
                font-size: 2.5rem; 
                margin-bottom: 0.5rem; 
            }

            .header h1 { 
                font-size: 1.5rem; 
                font-weight: 600; 
                margin-bottom: 0.25rem; 
            }

            .header p { 
                font-size: 0.9rem; 
                color: #666; 
            }

            .mode-card {
                display: flex;
                align-items: center;
                gap: 1rem;
                padding: 1rem 1.25rem;
                border: 1px solid #e5e5e5;
                border-radius: 12px;
                background: #fff;
                margin-bottom: 0.75rem;
                cursor: pointer;
                text-decoration: none;
                color: inherit;
                transition: border-color 0.15s, box-shadow 0.15s;
            }

            .mode-card:hover:not(.disabled) {
                border-color: #aaa;
                box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            }

            .mode-card.disabled { 
                opacity: 0.5; 
                cursor: not-allowed; 
                pointer-events: none; 
            }

            .icon-wrap {
                width: 46px; height: 46px;
                border-radius: 10px;
                display: flex; align-items: center; justify-content: center;
                font-size: 1.3rem;
                flex-shrink: 0;
            }

            .icon-wrap.teal  { 
                background: #e1f5ee; 
                color: #0f6e56; 
            }

            .icon-wrap.purple { 
                background: #eeedfe; 
                color: #534ab7; 
            }

            .icon-wrap.coral  { 
                background: #faece7; 
                color: #993c1d; 
            }

            .mode-info { 
                flex: 1; 
            }

            .mode-title {
                font-size: 0.95rem;
                font-weight: 600;
                margin-bottom: 2px;
                display: flex; align-items: center; gap: 0.4rem;
            }

            .mode-desc { 
                font-size: 0.82rem; 
                color: #666; 
            }

            .badge {
                font-size: 0.7rem;
                padding: 2px 7px;
                border-radius: 6px;
                font-weight: 500;
                background: #fff3cd;
                color: #856404;
            }

            .chevron { 
                color: #ccc; 
                font-size: 1.1rem; 
            }
            
        </style>
    </head>

    <body>
        <div class="container">
            <div class="header">
                <div class="marks">✕ ○</div>
                <h1>Tic-tac-toe</h1>
                <p>Choose how you want to play</p>
            </div>

            <div class="mode-card disabled">
                <div class="icon-wrap teal"><i class="ti ti-cpu"></i></div>
                <div class="mode-info">
                    <div class="mode-title">Play against AI <span class="badge">Coming soon</span></div>
                    <div class="mode-desc">Challenge a trained AI — no opponent needed</div>
                </div>
                <i class="ti ti-chevron-right chevron"></i>
            </div>

            <div class="mode-card disabled">
                <div class="icon-wrap purple"><i class="ti ti-users"></i></div>
                <div class="mode-info">
                    <div class="mode-title">Play against a friend <span class="badge">Coming soon</span></div>
                    <div class="mode-desc">Share a link and play with someone you know</div>
                </div>
                <i class="ti ti-chevron-right chevron"></i>
            </div>

            <a class="mode-card" href="/tictactoe/random">
                <div class="icon-wrap coral"><i class="ti ti-world"></i></div>
                <div class="mode-info">
                    <div class="mode-title">Play against a random opponent</div>
                    <div class="mode-desc">Get matched with whoever is online right now</div>
                </div>
                <i class="ti ti-chevron-right chevron"></i>
            </a>
        </div>
    </body>
</html>
