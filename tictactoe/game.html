<!DOCTYPE html>

<html>
    <head>
        <title>Tic-tac-toe</title>
        <style>
            body { 
                font-family: sans-serif; 
                display: flex; 
                flex-direction: column;
                align-items: center; 
                padding: 2rem; 
            }

            #board { 
                display: grid; 
                grid-template-columns: repeat(3, 100px);
                gap: 4px; 
                margin: 1rem 0; 
            }

            .cell { 
                width: 100px; 
                height: 100px; 
                font-size: 3rem; 
                cursor: pointer;
                border: 2px solid #ccc; 
                display: flex; 
                align-items: center;
                justify-content: center; 
            }

            .cell:hover:not(.taken) { 
                background: #f0f0f0; 
            }

            .cell.taken { 
                cursor: default; 
            }

            .cell.win  { 
                background: #d4edda; 
            }

            .cell.lose { 
                background: #f8d7da; 
            }

            #status { 
                font-size: 1.2rem; 
                margin: 1rem 0; 
            }

            #post-game-actions {
                display: none;
                gap: 0.75rem;
                margin-top: 0.5rem;
            }

            #post-game-actions.visible {
                display: flex;
            }

            #post-game-actions button {
                padding: 0.6rem 1.2rem;
                font-size: 0.95rem;
                border: 1px solid #ccc;
                border-radius: 8px;
                background: #fff;
                cursor: pointer;
            }

            #post-game-actions button:hover {
                background: #f0f0f0;
            }

            #btn-new-game {
                border-color: #1a5fa8;
                color: #1a5fa8;
                font-weight: 600;
            }
        </style>
    </head>

    <body>
        <a href="/tictactoe" style="display:inline-block; margin-bottom:1rem; font-size:0.9rem; color:#555; text-decoration:none;">← Back</a>
        <h1>Tic-tac-toe</h1>
        <div id="status">Connecting...</div>
        <div id="board">
            <!-- 9 cells rendered by JS -->
        </div>
        <div id="post-game-actions">
            <button id="btn-new-game" onclick="startNewGame()">New Game</button>
            <button id="btn-main-menu" onclick="goToMainMenu()">Main Menu</button>
        </div>

        <script>
            // crypto.randomUUID() usually only works with secure contexts like localhost or https, 
            // it's disabled on http
            // const playerId = crypto.randomUUID();
            
            // so we calculate a UUID ourselves, when crypto.randomUUID() is not available
            function generateUUID() {
                return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
                    const r = Math.random() * 16 | 0;
                    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
                });
            }
            const playerId = crypto?.randomUUID?.() ?? generateUUID();

            const host = window.location.host;
            
            // Use wss:// with HTTPS and ws:// otherwise, instead of ws:// everytime, because browsers will refuse to open a ws:// connection from an https:// page (mixed content block)
            const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";

            // Work out which WebSocket endpoint to connect to based on the page path
            // /tictactoe/random    -> /tictactoe/ws/{player_id}
            // /tictactoe/minimax   -> /tictactoe/ws/minimax/{player_id}?symbol=X
            const path = window.location.pathname;  // eg) /tictactoe/minimax
            const params = new URLSearchParams(window.location.search);
            const symbol = params.get("symbol");    // "X", "O", or null

            let wsUrl;
            if (path.endsWith("/random")) {
                wsUrl = `${protocol}//${host}/tictactoe/ws/${playerId}`;
            } else if (path.endsWith("/minimax")) {
                const sym = symbol || "X";
                wsUrl = `${protocol}//${host}/tictactoe/ws/minimax/${playerId}?symbol=${sym}`;
            } else if (path.endsWith("/q-agent")) {
                const sym = symbol || "X";
                wsUrl = `${protocol}//${host}/tictactoe/ws/q-agent/${playerId}?symbol=${sym}`;
            } else {
                // Fallback to /random
                wsUrl = `${protocol}//${host}/tictactoe/ws/${playerId}`;
            }
            
            const ws = new WebSocket(wsUrl)
            
            let mySymbol = null;
            let myTurn = false;
            let gameId = null;

            // Render the board from a flat 9-element array
            function renderBoard(board, winningCombo = null, outcome=null) {
                const boardEl = document.getElementById("board");
                boardEl.innerHTML = "";
                board.forEach((cell, i) => {
                    const div = document.createElement("div");
                    const isWinCell = winningCombo && winningCombo.includes(i);
                    let cls = "cell" + (cell ? " taken" : "");
                    if (isWinCell && outcome === "win") cls += " win";
                    if (isWinCell && outcome === "lose") cls += " lose";
                    div.className = cls
                    div.textContent = cell;
                    div.onclick = () => sendMove(i);
                    boardEl.appendChild(div);
                });
            }

            function sendMove(cell) {
                if (!myTurn || !gameId) return;
                ws.send(JSON.stringify({ type: "move", cell }));
                myTurn = false;  // optimistic — server will confirm
            }

            function showPostGameActions() {
                document.getElementById("post-game-actions").classList.add("visible");
            }

            function startNewGame() {
                window.location.reload();  // same path + symbol query param -> same mode, same symbol
            }

            function goToMainMenu() {
                window.location.href = "/tictactoe";
            }

            let opponentDisconnected = false;
            let gameOver = false

            ws.onmessage = ({ data }) => {
                const msg = JSON.parse(data);

                if (msg.type === "waiting") {
                    document.getElementById("status").textContent = msg.message;
                }

                else if (msg.type === "game_start") {
                    gameId = msg.game_id;
                    mySymbol = msg.symbol;
                    myTurn = msg.your_turn;
                    renderBoard(Array(9).fill(""));
                    document.getElementById("status").textContent =
                    `You are ${mySymbol}. ${myTurn ? "Your turn!" : "Opponent's turn."}`;
                }

                else if (msg.type === "game_update") {
                    myTurn = msg.current_turn === (mySymbol === "X" ? 0 : 1);
                    renderBoard(msg.board);
                    document.getElementById("status").textContent =
                    myTurn ? "Your turn!" : "Opponent's turn...";
                }

                else if (msg.type === "game_over") {
                    gameOver = true;
                    const outcome = msg.winner === mySymbol ? "win" 
                                    : msg.winner ? "lose" 
                                    : null; // draw - no highlight
                    if (msg.board) renderBoard(msg.board, msg.winning_combo, outcome);

                    if (msg.message === "Opponent disconnected.") {
                        opponentDisconnected = true;  // set flag BEFORE onclose fires
                    }

                    const result = msg.winner === mySymbol ? "You won!"
                                : msg.winner ? "You lost."
                                : msg.message || "Draw!";
                    document.getElementById("status").textContent = result;
                    showPostGameActions();
                }

                else if (msg.type === "error") {
                    console.warn("Server error:", msg.message);
                    document.getElementById("status").textContent = msg.message;
                    gameOver = true;  // ← prevents onclose from overwriting the message with Disconnected
                    showPostGameActions();
                }
            };

            
            // This should overwrite the message as long as it's not "Opponent disconnected" or "Game over"
            ws.onclose = () => {
                if (!opponentDisconnected && !gameOver) {
                    document.getElementById("status").textContent = "Disconnected.";
                    showPostGameActions();
                }
            };
            
        </script>
    </body>
</html>
