name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job 1 — Build and push Docker image to GHCR
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha, prefix=sha-
            type=raw, value=latest, enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Job 2 — Deploy to AWS EC2 VM
  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.AWS_VM_HOST }} >> ~/.ssh/known_hosts

      - name: Copy docker-compose.yml and nginx config to VM
        run: |
          scp -o StrictHostKeyChecking=no \
            -i ~/.ssh/deploy_key \
            docker-compose.yml \
            nginx/tictactoe.conf \
            ${{ secrets.AWS_VM_USER }}@${{ secrets.AWS_VM_HOST }}:~/tictactoe/

      - name: Deploy on VM
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/deploy_key \
            ${{ secrets.AWS_VM_USER }}@${{ secrets.AWS_VM_HOST }} \
            "cd ~/tictactoe && \
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin && \
            sudo cp tictactoe.conf /etc/nginx/sites-available/tictactoe && \
            sudo ln -sf /etc/nginx/sites-available/tictactoe /etc/nginx/sites-enabled/tictactoe && \
            sudo rm -f /etc/nginx/sites-enabled/default && \
            sudo nginx -t && sudo systemctl reload nginx && \
            IMAGE_TAG=$(echo '${{ github.sha }}' | cut -c1-7) \
            GITHUB_REPOSITORY=${{ github.repository }} \
            docker compose pull tictactoe && \
            IMAGE_TAG=$(echo '${{ github.sha }}' | cut -c1-7) \
            GITHUB_REPOSITORY=${{ github.repository }} \
            docker compose up -d --no-build && \
            docker image prune -f"

